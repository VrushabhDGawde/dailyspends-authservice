version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: spendsense-db
    environment:
      POSTGRES_DB: ${DB_NAME:-spendsense}
      POSTGRES_USER: ${DB_USERNAME:-spendsense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spendsense}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendsense-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-spendsense}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-spendsense}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-spendsense}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
